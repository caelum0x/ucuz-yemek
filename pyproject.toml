[project]
name = "ucuz-yemek"
version = "0.1.0"
description = "Real Turkish food-delivery budget search and price comparison (CLI + FastAPI web app), Trendyol Go and Yemeksepeti"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ucuz-yemek = "ucuz_yemek.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
